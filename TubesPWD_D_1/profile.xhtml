<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <!-- buka jalur koneksi lebih awal ke server Google Fonts sebelum file font-nya diunduh -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <!-- mengunduh file font Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../TubesPWD_D_1/css/style.css" />
  <link rel="stylesheet" href="../TubesPWD_D_1/css/profile.css" />
  <link rel="icon" type="image/svg+xml" href="../TubesPWD_D_1/images/Logo.svg" />
  <title>Cache-Carry-Co.</title>
</head>

<body>
  <div id="main-profile">
    <div id="main-profile-frame">
      <!-- nampilin foto avata -->
      <div id="user-avatar">
        <div class="profile-initial">-</div>
        <h2 class="nama-user" id="nama-user">-</h2>
      </div>

      <!-- Info User -->
      <div class="data-user">
        <div class="data">
          <span class="datalabel">Username</span>
          <span class="datavalue" id="username">-</span>
        </div>
        <div class="data">
          <span class="datalabel">Email</span>
          <span class="datavalue" id="email">-</span>
        </div>
        <div class="data">
          <span class="datalabel">Phone</span>
          <span class="datavalue" id="nomor_telepon">-</span>
        </div>
        <div class="data">
          <span class="datalabel">Address</span>
          <span class="datavalue" id="address">-</span>
        </div>
        <div class="data">
          <span class="datalabel">Password</span>
          <span class="datavalue" id="password">-</span>
        </div>
      </div>

      <!-- aksi -->
      <div class="profileActions">
        <button type="button" class="tombol" id="back">Back</button>
        <button type="button" class="tombol" id="edit">Edit</button>
        <button type="button" class="tombol" id="logout">Sign Out</button>
      </div>
    </div>
  </div>
  
  <script src="../TubesPWD_D_1/js/script.js"></script>
  <script src="../TubesPWD_D_1/js/profile.js"></script>
</body>

</html>
