<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <!-- buka jalur koneksi lebih awal ke server Google Fonts sebelum file font-nya diunduh -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <!-- mengunduh file font Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../Cache-Carry-Co. PWD-D/css/style.css" />
    <link rel="stylesheet" href="../Cache-Carry-Co. PWD-D/css/login_signIn.css" />
    <link rel="icon" type="image/svg+xml" href="../Cache-Carry-Co. PWD-D/images/Logo.svg" />
    <title>Sign In - Cache-Carry-Co.</title>
</head>

<body>
   <div id="login-page">
        <div class="login-container">
            <div class="login-section">
                <div class="judul">
                    <span><img src="../Cache-Carry-Co. PWD-D/images/Logo.svg" alt="Image" /></span>
                    <h2>Cache-Carry-Co.</h2>
                </div>

                <div class="welcome-header">
                    <h1>WELCOME</h1>
                </div>

                <div id="form-utama">
                    <form id="register-form" action="register.php" method="post">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="trex@gmail.com"  required="required"/>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="nomor_telepon" placeholder="08123456789" pattern="[0-9]{10,13}" required="required" />
                        </div>
                        
                        <div class="form-group">
                            <label for="alamat_default">Default Address</label> 
                            <input type="text" id="alamat_default" name="alamat_default" placeholder="742 Evergreen Terrace, Springfield, OR 97477, United States" required="required" />
                        </div>

                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" placeholder="Trex" required="required"/>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="••••••••" required="required"/>
                        </div>

                        <div class="button-group">
                            <input type="submit" value="Register" />
                        </div>

                        <p class="signup">
                            Already have account?
                            <a href="../Cache-Carry-Co. PWD-D/login.xhtml">Login</a>
                        </p>
                    </form>
                </div>
                <div id="auth-message">
                    <p id="auth-message"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="../Cache-Carry-Co. PWD-D/js/script.js"></script>
    <script src="../Cache-Carry-Co. PWD-D/js/login-sign.js"></script>
</body>

</html>
