<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Sunreef 80 Power - Cache-Carry-Co.</title>
  <link rel="stylesheet" href="../Cache-Carry-Co. PWD-D/css/style.css" />
  <link rel="stylesheet" type="text/css" href="../Cache-Carry-Co. PWD-D/css/beliSewa.css" />
</head>
<body>
  <div id="navbar">
    <div id="logo">
      <a href="../Cache-Carry-Co. PWD-D/index.xhtml">
        <img src="../Cache-Carry-Co. PWD-D/images/Logo.svg" alt="logo" />
        <h2>Cache-Carry-Co. </h2>
      </a>
    </div>

    <div id="searchBar">
      <img src="../Cache-Carry-Co. PWD-D/images/Search.svg" alt="Search Icon" class="searchIcon" />
      <input type="text" name="quickSearch" id="quickSearch" placeholder="Quick search any vehicle..." />
    </div>

    <!-- nanti pakai JS WAJIB nambahin class ke menu yang diclik -->
    <div id="navMenu">
      <a href="">Home</a>
      <a href="">Vehicle</a>
      <a href="">Garage</a>
      <a href="">Cart</a>
    </div>

    <div id="profile">
      <button type="button" class="signIn">
        Sign In
      </button>
    </div>
  </div>

  <!-- blm revisi ini -->
  <div class="productWrapper">
    <div class="productImg">
      <img id="productImgEl"
           src="../Cache-Carry-Co. PWD-D/images/Kendaraan Laut/Sunreef 80 Power.svg"
           alt="Sunreef 80 Power" />
    </div>

    <div id="infoEl" class="info">Laut - 2022</div>
    <h1 id="productNameEl" class="productName">Sunreef 80 Power</h1>

    <div class="specList">
      <div class="specBox">
        <div id="specPenumpang" class="specVal">8 - 12</div>
        <div class="specLbl">pessangers</div>
      </div>
      <div class="specBox">
        <div id="specKecepatan" class="specVal">20 - 25 kn</div>
        <div class="specLbl">speed</div>
      </div>
      <div class="specBox">
        <div id="specJarak" class="specVal">3,000+ nm</div>
        <div class="specLbl">range</div>
      </div>
      <div class="specBox">
        <div id="specWifi" class="specVal">Wi-Fi</div>
        <div class="specLbl">Available</div>
      </div>
    </div>

    <div class="subtitle">CHOOSE TRANSACTION</div>
    <div class="trxOptions">
      <div id="trxBuy" class="trxCard active" onclick="selectTransaction('buy')">
        <div class="trxLabel">Buy</div>
        <div id="hargaBeli" class="trxPrice">Rp 95.000.000.000</div>
      </div>
      <div id="trxRent" class="trxCard" onclick="selectTransaction('rent')">
        <div class="trxLabel">Rent</div>
        <div id="hargaSewa" class="trxPrice">Rp 200.000.000</div>
      </div>
    </div>

    <div id="qtyBar" class="qtyBar">
      <div class="qtyUnitGroup">
        <div class="qtyLabel">
          Total<br />
          Vehicle
        </div>
        <div class="qtyControl">
          <button type="button" class="qtyBtn" onclick="updateQty(-1)">-</button>
          <span id="qtyCount" class="qtyCount">1</span>
          <button type="button" class="qtyBtn" onclick="updateQty(1)">+</button>
        </div>
      </div>

      <div id="durationGroup" class="durationGroup">
        <div class="qtyLabel">
          Duration<br />
          (Days)
        </div>
        <div class="qtyControl">
          <button type="button" class="qtyBtn" onclick="updateDuration(-1)">-</button>
          <span id="durationCount" class="qtyCount">1</span>
          <button type="button" class="qtyBtn" onclick="updateDuration(1)">+</button>
        </div>
      </div>
    </div>

    <div class="btnGroup">
      <button type="button" class="btnCart" title="Add to Cart" onclick="addToCart()">+</button>
      <button type="button" id="btnCheckout" class="btnMain">BUY NOW</button>
    </div>
  </div>

    <div id="cartMessage" class="cartMessage"></div>

  <script src="../Cache-Carry-Co. PWD-D/js/script.js"></script>
  <script type="text/javascript" src="../Cache-Carry-Co. PWD-D/js/beliSewa.js"></script>
</body>
</html>
